name: GitHub Pages
# web/ is committed, prebuilt output. Backend `npm run build:wasm` / `npm run
# sync:web` and frontend `npm run build` produce it locally; this workflow only
# tests the committed output and publishes the directory unchanged.
on:
  push:
    branches: [main]
    paths: [app/**, web/**, tests/**, tools/**, package.json, package-lock.json, .github/workflows/pages.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify assets and run native browser E2E
        run: npm run test:automation
      - name: Save test results for this code checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-checkpoint-${{ github.sha }}
          path: logs/automation/
          if-no-files-found: warn
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed web/ matches app/ and the backend core
        run: node tests/artifacts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
