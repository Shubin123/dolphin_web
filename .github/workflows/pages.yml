name: GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Import current backend runtime and matching source
        run: node tools/latest-backend.mjs
        env:
          GH_TOKEN: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
      - run: npm run build
      - name: Restore WebKit browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-webkit-${{ hashFiles('package-lock.json') }}
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Frontend automation suite
        run: npm run test:automation
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTOMATION_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-automation-report
          path: logs/automation
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 15; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              if (result.data.artifacts.some(artifact => artifact.name === 'github-pages')) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Pages artifact metadata did not become available');
      - uses: actions/deploy-pages@v4
        id: deployment
