name: GitHub Pages
# web/ is committed, prebuilt output. Backend `npm run build:wasm` / `npm run
# sync:web` and frontend `npm run build` produce it locally; this workflow only
# verifies the committed inventories and publishes the directory unchanged.
on:
  push:
    branches: [main]
    paths: [web/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed web/ matches app/ and the backend core
        run: node tests/artifacts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
